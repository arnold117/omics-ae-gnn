# Multi-Omics Integration Configuration
# Template configuration file - customize for your dataset

project:
  name: "omics_integration"
  version: "3.0.0"
  description: "Multi-omics autoencoder-GNN integration pipeline"

# ==============================================================================
# DATA CONFIGURATION
# ==============================================================================
# IMPORTANT: Replace these paths and sample definitions with your own data

data:
  samples:
    total: 20  # REPLACE: Total number of samples in your dataset

    # REPLACE: Define your sample groups below
    # Example structure - modify according to your experimental design
    groups:
      - name: "regionA_tissue1"
        samples: ["S01", "S02", "S03"]  # REPLACE with your sample IDs
        tissue: "root"
        tissue_label: 0
        geography: "region_A"
        geography_label: 0
        cultivation: "wild"
        cultivation_label: 0

      - name: "regionA_tissue2"
        samples: ["S04", "S05", "S06"]
        tissue: "stem"
        tissue_label: 1
        geography: "region_A"
        geography_label: 0
        cultivation: "wild"
        cultivation_label: 0

      - name: "regionA_tissue3"
        samples: ["S07", "S08", "S09"]
        tissue: "leaf"
        tissue_label: 2
        geography: "region_A"
        geography_label: 0
        cultivation: "wild"
        cultivation_label: 0

      - name: "regionB_tissue1"
        samples: ["S10", "S11", "S12"]
        tissue: "root"
        tissue_label: 0
        geography: "region_B"
        geography_label: 1
        cultivation: "wild"
        cultivation_label: 0

      - name: "regionB_tissue2"
        samples: ["S13", "S14", "S15"]
        tissue: "stem"
        tissue_label: 1
        geography: "region_B"
        geography_label: 1
        cultivation: "wild"
        cultivation_label: 0

      - name: "regionB_tissue3"
        samples: ["S16", "S17", "S18"]
        tissue: "leaf"
        tissue_label: 2
        geography: "region_B"
        geography_label: 1
        cultivation: "wild"
        cultivation_label: 0

      - name: "regionB_culture"
        samples: ["S19", "S20"]
        tissue: "tissue_culture"
        tissue_label: 3
        geography: "region_B"
        geography_label: 1
        cultivation: "cultured"
        cultivation_label: 1

  transcriptome:
    expected_degs: 10000      # REPLACE: Approximate DEG count
    fpkm_threshold: 0.0
    description: "RNA-seq gene expression data"

  metabolome:
    expected_count: 1000      # REPLACE: Approximate metabolite count
    min_detection_rate: 0.5
    description: "Non-targeted metabolite profiling data"

# ==============================================================================
# PREPROCESSING
# ==============================================================================

preprocessing:
  gene_expression:
    transform: "log2"         # log2(x + 1)
    normalization: "zscore"   # per-gene across samples
    remove_low_expr: false
    missing_value_threshold: 0.2

  metabolite:
    transform: "log2"         # log2(x + 1)
    normalization: "zscore"   # per-metabolite across samples
    imputation: "zero"        # Options: "zero", "knn", "median"
    missing_value_threshold: 0.3

# ==============================================================================
# HARDWARE (also see config/hardware.yaml for detailed settings)
# ==============================================================================

hardware:
  device_preference: ["mps", "cuda", "cpu"]
  mixed_precision: false
  num_workers: 4

# ==============================================================================
# PIPELINE SETTINGS
# ==============================================================================

pipeline:
  reproducibility:
    random_seed: 42
    deterministic: true

  output:
    save_intermediate: true
    figure_format: "png"
    figure_dpi: 300
    high_res_dpi: 600

# ==============================================================================
# MODEL ARCHITECTURE
# ==============================================================================

models:
  autoencoder:
    latent_dim: 64
    dropout: 0.2
    architecture: "symmetric"  # input -> 2048 -> 512 -> 128 -> 64

  gnn:
    hidden_dims: [256, 128, 64]
    n_heads: 4
    dropout: 0.2
    similarity_threshold: 0.5

# ==============================================================================
# TRAINING CONFIGURATION
# ==============================================================================

training:
  autoencoder:
    epochs: 100
    learning_rate: 0.001
    kl_weight: 0.001
    early_stopping_patience: 15

  gnn:
    epochs: 200
    learning_rate: 0.001
    task_weights:
      tissue: 1.0
      geography: 0.5
      cultivation: 0.5

# ==============================================================================
# VISUALIZATION SETTINGS
# ==============================================================================

visualization:
  color_palettes:
    tissue: ["#E64B35", "#4DBBD5", "#00A087", "#3C5488"]
    geography: ["#F39B7F", "#8491B4"]

  font_size:
    title: 14
    label: 12
    tick: 10

  figure_size:
    default: [8, 6]
    wide: [12, 6]
    tall: [8, 10]
